<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GTM — Relatório Diário de Obra</title>
<meta name="theme-color" content="#123F5C">
<meta name="description" content="Relatório Diário de Obra da GTM Prestadora de Serviços — preenchimento offline em campo.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0B1620; --surface:#112430; --surface-2:#16303F; --surface-3:#1C3B4D;
    --border:#22404F; --text:#EAF2F6; --text-dim:#8FA6B2;
    --brand:#0E7BA6; --brand-dark:#123F5C;
    --accent:#E8871E; --accent-dark:#C96010;
    --success:#2FA65A; --success-bg:rgba(47,166,90,.15);
    --danger:#D6534A; --danger-bg:rgba(214,83,74,.15);
    --radius:14px; --radius-sm:9px;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  html[data-theme="light"]{
    --bg:#F3F6F8; --surface:#FFFFFF; --surface-2:#EAF0F3; --surface-3:#DCE7EC;
    --border:#D2DEE4; --text:#0F2430; --text-dim:#5C7180;
    --accent:#C96010; --accent-dark:#A6500C;
    --success:#1F8C4C; --success-bg:rgba(31,140,76,.12);
    --danger:#C23B32; --danger-bg:rgba(194,59,50,.12);
    --shadow:0 10px 24px rgba(15,36,48,.12);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  svg{width:18px; height:18px; flex-shrink:0; display:inline-block;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
  }
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  .hidden{display:none !important;}
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}

  /* ---------- Header ---------- */
  .app-header{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:calc(10px + var(--safe-top)) 14px 10px; background:var(--brand-dark);
    color:#fff; box-shadow:var(--shadow); z-index:5;
  }
  .app-header img.logo{width:34px; height:34px; border-radius:50%; flex:0 0 auto; background:#fff;}
  .app-header .titles{flex:1; min-width:0;}
  .app-header .titles h1{font-size:15px; font-weight:700; margin:0; line-height:1.2;}
  .app-header .titles p{font-size:11.5px; margin:1px 0 0; color:rgba(255,255,255,.7);}
  .status-pill{
    font-size:10.5px; font-weight:600; padding:4px 9px; border-radius:20px;
    display:flex; align-items:center; gap:5px; flex:0 0 auto; white-space:nowrap;
  }
  .status-pill .dot{width:6px; height:6px; border-radius:50%;}
  .status-pill.online{background:rgba(47,166,90,.2); color:#8BE0A6;}
  .status-pill.online .dot{background:#3FD777;}
  .status-pill.offline{background:rgba(214,83,74,.2); color:#F0A199;}
  .status-pill.offline .dot{background:var(--danger);}
  .icon-btn{
    background:rgba(255,255,255,.12); border:none; color:#fff; width:32px; height:32px;
    border-radius:9px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .icon-btn svg{width:17px; height:17px;}
  .back-btn{background:none; border:none; color:#fff; width:30px; height:30px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; margin-right:-2px;}
  .back-btn svg{width:21px; height:21px;}

  /* ---------- Main / Screens ---------- */
  .app-main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .app-footer{
    flex:0 0 auto; padding:12px 14px calc(12px + var(--safe-bottom)); background:var(--surface);
    border-top:1px solid var(--border); z-index:4;
  }
  .container{padding:14px; max-width:640px; margin:0 auto;}

  .btn{
    width:100%; padding:14px; border-radius:var(--radius); border:none; font-size:15px;
    font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:active{background:var(--accent-dark);}
  .btn-primary:disabled{background:var(--surface-3); color:var(--text-dim);}
  .btn-secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn-danger-ghost{background:none; color:var(--danger); font-weight:600;}
  .btn-sm{padding:9px 12px; font-size:13px; border-radius:var(--radius-sm); width:auto;}

  /* ---------- Lista de relatórios ---------- */
  .empty-state{text-align:center; padding:60px 20px; color:var(--text-dim);}
  .empty-state svg{width:52px; height:52px; opacity:.4; margin-bottom:14px;}
  .empty-state h3{color:var(--text); font-size:16px; margin:0 0 6px;}
  .empty-state p{font-size:13.5px; margin:0; line-height:1.5;}

  .rdo-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; margin-bottom:10px;
  }
  .rdo-card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .rdo-card .fazenda{font-size:15.5px; font-weight:700; margin:0;}
  .rdo-card .sub{font-size:12.5px; color:var(--text-dim); margin:2px 0 12px;}
  .badge{
    font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; white-space:nowrap;
    display:inline-block;
  }
  .badge.rascunho{background:var(--surface-3); color:var(--text-dim);}
  .badge.concluido{background:var(--success-bg); color:var(--success);}
  .badge.pendente-sync{background:rgba(232,135,30,.15); color:var(--accent);}
  .rdo-card .del{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--border); background:none;
    color:var(--text-dim); flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  }
  .rdo-card .del svg{width:13px; height:13px;}

  /* ---------- Barra de progresso (reutilizada no card e nas seções) ---------- */
  .progress-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .progress-track{flex:1; height:6px; border-radius:10px; background:var(--surface-3); overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); border-radius:10px; transition:width .2s ease;}
  .progress-num{font-size:12.5px; font-weight:700; color:var(--text-dim); flex:0 0 auto; min-width:36px; text-align:right;}

  /* ---------- Lista vertical de seções ---------- */
  .progress-header{padding:2px 0 4px;}
  .secoes-list{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;
  }
  .secao-row{
    display:flex; align-items:center; gap:12px; padding:16px 14px; border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .secao-row:last-child{border-bottom:none;}
  .secao-row .dot{width:9px; height:9px; border-radius:50%; background:var(--surface-3); flex:0 0 auto;}
  .secao-row.completo .dot{background:var(--success);}
  .secao-row .nome{flex:1; font-size:14.5px; font-weight:600;}
  .secao-row .status{font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; gap:3px;}
  .secao-row.completo .status{color:var(--success);}
  .secao-row .status svg{width:15px; height:15px;}

  /* ---------- Fields ---------- */
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:6px;}
  .field label .req{color:var(--accent);}
  .field input[type=text], .field input[type=number], .field input[type=date],
  .field textarea, .field .fake-select{
    width:100%; padding:12px 13px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:14.5px;
  }
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--brand);}
  .field textarea{resize:vertical; min-height:64px; line-height:1.4;}
  .fake-select{display:flex; align-items:center; justify-content:space-between; cursor:pointer; gap:8px;}
  .fake-select span.val{color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fake-select span.placeholder{color:var(--text-dim);}
  .fake-select svg{width:16px; height:16px; color:var(--text-dim); flex:0 0 auto;}
  .fake-select.locked{opacity:.6; cursor:default;}
  .row-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}

  .section-title{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    color:var(--text-dim); margin:20px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .helper-text{font-size:12px; color:var(--text-dim); margin:-6px 0 14px; line-height:1.5;}
  .sync-agora-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:12px; color:var(--text-dim); margin:-6px 0 14px; line-height:1.5;
  }
  .btn-sync-agora{
    background:none; border:none; color:var(--brand); font-weight:700; font-size:12px;
    padding:2px 0; flex:0 0 auto; white-space:nowrap; cursor:pointer;
  }
  html[data-theme="light"] .btn-sync-agora{color:var(--brand-dark);}

  /* ---------- Atividade cards ---------- */
  .ativ-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:13px; margin-bottom:10px; cursor:pointer;
  }
  .ativ-card .top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:6px;}
  .ativ-card .tipo{font-weight:700; font-size:14px;}
  .ativ-card .resumo{font-size:12.5px; color:var(--text-dim); line-height:1.5;}
  .ativ-card .trash{background:none; border:none; color:var(--text-dim); flex:0 0 auto; padding:2px;}
  .ativ-card .trash svg{width:17px; height:17px;}

  .add-dashed{
    width:100%; padding:13px; border-radius:var(--radius); border:1.5px dashed var(--border);
    background:none; color:var(--brand); font-weight:700; font-size:13.5px;
    display:flex; align-items:center; justify-content:center; gap:7px; cursor:pointer;
  }
  html[data-theme="light"] .add-dashed{color:var(--brand-dark);}

  .eq-pair{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .eq-pair .fake-select{flex:1;}
  .eq-pair .rm{background:none; border:none; color:var(--text-dim); flex:0 0 auto; padding:6px;}
  .eq-pair .rm svg{width:16px; height:16px;}

  .maquina-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px; margin-bottom:9px;
  }
  .maquina-card .row-2{margin-bottom:9px;}
  .maquina-card .row-2 input{
    width:100%; padding:12px 13px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:14.5px;
  }
  .maquina-card .row-2 input:focus{outline:none; border-color:var(--brand);}
  .rm-maquina{
    width:100%; background:none; border:none; color:var(--danger); font-size:12.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:5px; padding:4px; cursor:pointer;
  }
  .rm-maquina svg{width:13px; height:13px;}

  /* ---------- Fotos de evidência ---------- */
  .foto-grid{display:flex; flex-wrap:wrap; gap:9px; margin-bottom:8px;}
  .foto-thumb{width:76px; height:76px; border-radius:10px; overflow:hidden; position:relative;
    border:1px solid var(--border); flex:0 0 auto;}
  .foto-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .foto-thumb .rm-foto{
    position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%;
    background:rgba(0,0,0,.6); color:#fff; border:none; display:flex; align-items:center; justify-content:center;
  }
  .foto-thumb .rm-foto svg{width:11px; height:11px;}
  .foto-actions-row{display:flex; gap:8px; margin-bottom:8px;}
  .foto-actions-row .add-dashed{flex:1; width:auto; font-size:13px; padding:12px 6px;}

  /* ---------- GPS ---------- */
  .gps-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:8px;}
  .gps-card .gps-title{font-weight:700; font-size:14px; display:flex; align-items:center; gap:7px; margin-bottom:4px;}
  .gps-card .gps-title svg{width:16px; height:16px; color:var(--success);}
  .gps-card .coords{font-size:12.5px; color:var(--text-dim); margin:0 0 12px; font-variant-numeric:tabular-nums;}
  .gps-card .actions{display:flex; gap:8px;}
  .gps-card .actions .btn, .gps-card .actions a{flex:1; text-decoration:none; display:flex; align-items:center; justify-content:center;}

  /* ---------- Bottom sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:20;
    display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .sheet-overlay.show{opacity:1; pointer-events:auto;}
  .sheet{
    background:var(--surface); width:100%; max-height:74vh; border-radius:18px 18px 0 0;
    display:flex; flex-direction:column; transform:translateY(100%); transition:transform .2s ease;
    padding-bottom:var(--safe-bottom);
  }
  .sheet-overlay.show .sheet{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--border); border-radius:20px; margin:10px auto 4px;}
  .sheet-title{font-size:15px; font-weight:700; padding:8px 18px 10px; border-bottom:1px solid var(--border);}
  .sheet-filter{padding:10px 14px; border-bottom:1px solid var(--border);}
  .sheet-filter input{
    width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:14px;
  }
  .sheet-list{overflow-y:auto; padding:6px 8px;}
  .sheet-opt{
    width:100%; text-align:left; padding:13px 12px; background:none; border:none; color:var(--text);
    font-size:14.5px; border-radius:var(--radius-sm); display:flex; justify-content:space-between; align-items:center;
  }
  .sheet-opt.selected{color:var(--brand); font-weight:700; background:var(--surface-2);}
  html[data-theme="light"] .sheet-opt.selected{color:var(--brand-dark);}
  .sheet-opt svg{width:17px; height:17px;}
  .sheet-empty{padding:24px; text-align:center; color:var(--text-dim); font-size:13.5px;}

  /* ---------- Calendário customizado ---------- */
  .cal-header{display:flex; align-items:center; justify-content:space-between; padding:8px 4px 16px;}
  .cal-titulo{font-weight:700; font-size:15px;}
  .cal-nav{background:var(--surface-2); border:none; width:32px; height:32px; border-radius:9px;
    color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .cal-nav svg{width:16px; height:16px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
  .cal-dow{margin-bottom:6px;}
  .cal-dow span{text-align:center; font-size:11px; font-weight:700; color:var(--text-dim); padding:4px 0;}
  .cal-day{
    aspect-ratio:1; border:none; background:none; color:var(--text); border-radius:10px; font-size:14px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .cal-day.hoje{font-weight:700; color:var(--brand);}
  html[data-theme="light"] .cal-day.hoje{color:var(--brand-dark);}
  .cal-day.selecionado{background:var(--accent); color:#fff; font-weight:700;}

  /* ---------- Modal / Toast ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:30;
    display:flex; align-items:center; justify-content:center; padding:24px;
    opacity:0; pointer-events:none; transition:opacity .15s ease;
  }
  .modal-overlay.show{opacity:1; pointer-events:auto;}
  .modal-box{
    background:var(--surface); border-radius:var(--radius); padding:20px; max-width:340px; width:100%;
    box-shadow:var(--shadow);
  }
  .modal-box h3{margin:0 0 8px; font-size:16px;}
  .modal-box p{margin:0 0 18px; font-size:13.5px; color:var(--text-dim); line-height:1.5;}
  .modal-box .actions{display:flex; gap:9px;}
  .modal-box .actions .btn{padding:11px;}

  .toast{
    position:fixed; left:50%; bottom:calc(20px + var(--safe-bottom)); transform:translateX(-50%);
    background:var(--surface-3); color:var(--text); padding:11px 18px; border-radius:30px;
    font-size:13px; font-weight:600; z-index:40; box-shadow:var(--shadow); white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .toast.show{opacity:1;}

  /* ---------- Sucesso / resultado do envio ---------- */
  .sucesso-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; text-align:center; padding:30px;}
  .sucesso-check{
    width:74px; height:74px; border-radius:50%; background:var(--success-bg); color:var(--success);
    display:flex; align-items:center; justify-content:center; margin-bottom:18px;
  }
  .sucesso-check svg{width:38px; height:38px;}
  .sucesso-check.estado-enviando{background:var(--surface-3); color:var(--brand);}
  html[data-theme="light"] .sucesso-check.estado-enviando{color:var(--brand-dark);}
  .sucesso-check.estado-enviando svg{animation:girar 1s linear infinite;}
  @keyframes girar{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .sucesso-check.estado-pendente{background:rgba(232,135,30,.15); color:var(--accent);}
  .sucesso-wrap h2{margin:0 0 8px; font-size:19px;}
  .sucesso-wrap p{margin:0 0 26px; color:var(--text-dim); font-size:13.5px; max-width:280px; line-height:1.5;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"></div>

<div id="sheet-overlay" class="sheet-overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheet-title"></div>
    <div class="sheet-filter hidden" id="sheet-filter-wrap">
      <input type="text" id="sheet-filter" placeholder="Buscar...">
    </div>
    <div class="sheet-list" id="sheet-list"></div>
  </div>
</div>

<div id="modal-overlay" class="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>

<div id="toast" class="toast"></div>

<script>
(function(){
  "use strict";

  /* ======================= CATÁLOGOS (cadastros mestres) ======================= */
  /* Estes catálogos são a base do que, no painel administrativo (a ser
     construído depois que o PWA estiver estável), vai virar uma tela de
     "Cadastros" editável pelo admin — cliente, contrato, tipo de estrada,
     equipe/frente, fazenda, encarregado, supervisor, técnico/supervisor
     Arauco, trecho, tipo de atividade e tipo (Hora Máquina). Por ora os
     valores abaixo são a semente inicial (dados que já apareciam nos
     relatórios de exemplo); o PWA lê tudo daqui, então quando o cadastro
     dinâmico existir, basta trocar a fonte destes arrays. */
  var CATALOGO = {
    clientes: ["Colheita","Transporte","Silvicultura"],
    contratos: ["ARAUCO"],
    tiposEstrada: ["Acesso","Estrada Interna da Fazenda","Controle de Erosão","Aceiro"],
    equipesFrente: ["GTM - Obra de Arte 02"],
    fazendas: ["Elo Dourado 2","Doce Moranga"],
    encarregados: ["Elson"],
    supervisores: ["Valmir"],
    tecnicosArauco: ["Edwilson"],
    supervisoresArauco: ["Luciano"],
    trechos: ["CAP-05","106"],
    tiposAtividade: ["Construção de Aterro","Limpeza de Camada Vegetal","Carregamento de Material","Transporte de Material","Hora Máquina Trabalhada"],
    tiposHoraMaquina: ["Carregamento","Transporte","Deslocamento"],
    equipamentos: ["ESH-18","MN-16","PC-26-03","RC-09","CP-03","CB-20","CB-22"],
    operadores: ["Leandro Félix","Leandro Recalde","Cherri dos Santos","Silvanei Costa","Antônio Cleonildo","Reginaldo da Silva","Gilberto Rodrigues","Elson","Valmir","Edwilson","Luciano"]
  };

  // Nomes das categorias no banco (singular) -> chave correspondente aqui no
  // CATALOGO (plural). listar_cadastros() devolve {"cliente":[...], ...}.
  var CATALOGO_KEY_MAP = {
    cliente: "clientes", contrato: "contratos", tipo_estrada: "tiposEstrada",
    equipe_frente: "equipesFrente", fazenda: "fazendas", encarregado: "encarregados",
    supervisor: "supervisores", tecnico_arauco: "tecnicosArauco", supervisor_arauco: "supervisoresArauco",
    trecho: "trechos", tipo_atividade: "tiposAtividade", tipo_hora_maquina: "tiposHoraMaquina",
    equipamento: "equipamentos", operador: "operadores"
  };

  /* ======================= SUPABASE ======================= */
  var SUPABASE_URL = "https://ogmovdwcoxfoemutqugk.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_TNN3hOofPJ9YHKTS3vzg0Q_e567QIMV";
  var BUCKET_EVIDENCIAS = "evidencias_rdo";
  var supabaseClient = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  var CADASTROS_CACHE_KEY = "gtm_rdo_cadastros_cache";

  // Aplica os dados vindos do banco por cima do CATALOGO (mutando o mesmo
  // objeto, não trocando a referência -- várias partes do app guardam
  // ponteiro pra CATALOGO.equipamentos etc., então precisa continuar sendo
  // o mesmo objeto).
  function aplicarCadastros(dados){
    if (!dados) return;
    Object.keys(CATALOGO_KEY_MAP).forEach(function(catKey){
      var jsKey = CATALOGO_KEY_MAP[catKey];
      if (dados[catKey] && dados[catKey].length){
        // Muta o array existente em vez de trocar a referência -- IDENT_CAMPOS
        // guarda um ponteiro direto pro array (ex: opts: CATALOGO.clientes)
        // capturado uma única vez no carregamento do script; se a gente
        // reatribuísse CATALOGO[jsKey] = novoArray, esse ponteiro antigo
        // ficaria desatualizado para sempre.
        var arr = CATALOGO[jsKey];
        arr.length = 0;
        dados[catKey].forEach(function(v){ arr.push(v); });
      }
    });
  }

    try {
      var raw = localStorage.getItem(CADASTROS_CACHE_KEY);
      if (raw) aplicarCadastros(JSON.parse(raw));

  }

  /* ======================= COMPRESSÃO DE FOTOS ======================= */
  // Fotos de câmera saem do aparelho com 3000-4000px de lado e vários MB cada.
  // Guardar isso cru no IndexedDB/memória foi o que causava o app fechar por
  // estouro de memória. Toda foto passa por aqui antes de ser guardada:
  // redesenha num canvas menor e reexporta como JPEG comprimido.
  var FOTO_MAX_DIM = 1600;   // maior lado da imagem, em pixels
  var FOTO_QUALIDADE = 0.75; // qualidade JPEG (0 a 1)

  function comprimirImagem(file, maxDim, qualidade){
    return new Promise(function(resolve){
      var urlTemp;
      try { urlTemp = URL.createObjectURL(file); } catch(e){ resolve(file); return; }
      var img = new Image();
      img.onload = function(){
        try {
          var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          if (!w || !h){ try { URL.revokeObjectURL(urlTemp); } catch(e){} resolve(file); return; }
          var maior = Math.max(w, h);
          var escala = maior > maxDim ? (maxDim / maior) : 1;
          var novoW = Math.max(1, Math.round(w * escala));
          var novoH = Math.max(1, Math.round(h * escala));
          var canvas = document.createElement("canvas");
          canvas.width = novoW; canvas.height = novoH;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, novoW, novoH);
          canvas.toBlob(function(blob){
            try { URL.revokeObjectURL(urlTemp); } catch(e){}
            resolve(blob || file);
          }, "image/jpeg", qualidade);
        } catch(e){
          try { URL.revokeObjectURL(urlTemp); } catch(e2){}
          resolve(file);
        }
      };
      img.onerror = function(){
        try { URL.revokeObjectURL(urlTemp); } catch(e){}
        resolve(file);
      };
      img.src = urlTemp;
    });
  }

  /* ======================= INDEXEDDB ======================= */
  var DB_NAME = "gtm_rdo_db", DB_STORE = "relatorios";
  var dbPromise = null;
  function dbOpen(){
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function(resolve, reject){
      if (!("indexedDB" in window)){ reject(new Error("IndexedDB indisponível")); return; }
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function(){
        var db = req.result;
        if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE, { keyPath:"id" });
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
    return dbPromise;
  }
  function dbGetAll(){
    return dbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, "readonly");
        var req = tx.objectStore(DB_STORE).getAll();
        req.onsuccess = function(){ resolve(req.result || []); };
        req.onerror = function(){ reject(req.error); };
      });
    }).catch(function(){ return []; });
  }
  function dbPut(relatorio){
    return dbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put(relatorio);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    }).catch(function(){ /* localStorage fallback silencioso */
      try {
        var all = JSON.parse(localStorage.getItem("gtm_rdo_fallback") || "{}");
        all[relatorio.id] = relatorio;
        localStorage.setItem("gtm_rdo_fallback", JSON.stringify(all));
      } catch(e){}
    });
  }
  function dbDelete(id){
    return dbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).delete(id);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    }).catch(function(){});
  }

  function persistir(relatorio){ dbPut(relatorio); }

  // Filtra sem recriar o DOM: só alterna a classe "hidden" nos itens que já

  function filtrarSheetList(query){
    var list = document.getElementById("sheet-list");
    var itens = list.querySelectorAll(".sheet-opt");
    if (!itens.length) return;
    var q = query.trim().toLowerCase();
    var visiveis = 0;
    itens.forEach(function(btn){
      var bate = !q || (btn.getAttribute("data-busca") || "").indexOf(q) !== -1;
      btn.classList.toggle("hidden", !bate);
      if (bate) visiveis++;
    });
    var vazio = list.querySelector(".sheet-empty");
    if (visiveis === 0 && !vazio){
      vazio = document.createElement("div");
      vazio.className = "sheet-empty";
      vazio.textContent = "Nenhuma opção encontrada.";
      list.appendChild(vazio);

  /* ---------- Calendário customizado (bottom-sheet), substitui <input type=date> ---------- */
  var MESES_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  var DIAS_SEMANA_PT = ["D","S","T","Q","Q","S","S"];
  var _dateSheet = null;

  function parseISODate(iso){
    var p = iso.split("-");
    return new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  }
  function toISODate(d){
    function pad(n){ return n < 10 ? "0"+n : ""+n; }
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }

  function openDateSheet(valorAtualISO, onSelect){
    var base = valorAtualISO ? parseISODate(valorAtualISO) : new Date();
    _dateSheet = { ano: base.getFullYear(), mes: base.getMonth(), selecionadoISO: valorAtualISO || null, onSelect: onSelect };
    document.getElementById("sheet-title").textContent = "Selecionar data";
    document.getElementById("sheet-filter-wrap").classList.add("hidden");
    renderCalendarSheet();
    document.getElementById("sheet-overlay").classList.add("show");

  function renderCalendarSheet(){
    var st = _dateSheet;
    var list = document.getElementById("sheet-list");
    var primeiroDia = new Date(st.ano, st.mes, 1);
    var offset = primeiroDia.getDay();
    var diasNoMes = new Date(st.ano, st.mes+1, 0).getDate();
    var hojeISO = toISODate(new Date());

    var html = '<div class="cal-header">' +
      '<button class="cal-nav" id="cal-prev">'+backIcon()+'</button>' +
      '<span class="cal-titulo">'+MESES_PT[st.mes]+' '+st.ano+'</span>' +
      '<button class="cal-nav" id="cal-next">'+chevronIcon()+'</button>' +
    '</div>';
    html += '<div class="cal-grid cal-dow">' + DIAS_SEMANA_PT.map(function(d){ return '<span>'+d+'</span>'; }).join("") + '</div>';
    html += '<div class="cal-grid cal-days">';
    for (var i=0;i<offset;i++) html += '<span class="cal-vazio"></span>';
    for (var dia=1; dia<=diasNoMes; dia++){
      var iso = toISODate(new Date(st.ano, st.mes, dia));
      var cls = "cal-day";
      if (iso === st.selecionadoISO) cls += " selecionado";
      if (iso === hojeISO) cls += " hoje";
      html += '<button class="'+cls+'" data-iso="'+iso+'">'+dia+'</button>';
    }
    html += '</div>';
    html += '<button class="btn btn-secondary btn-sm" id="cal-hoje" style="width:100%; margin-top:10px;">Hoje</button>';

    list.innerHTML = html;

    document.getElementById("cal-prev").onclick = function(){
      st.mes--; if (st.mes < 0){ st.mes = 11; st.ano--; }
      renderCalendarSheet();
    };
    document.getElementById("cal-next").onclick = function(){
      st.mes++; if (st.mes > 11){ st.mes = 0; st.ano++; }
      renderCalendarSheet();
    };
    document.getElementById("cal-hoje").onclick = function(){
      var iso = toISODate(new Date());
      closeSheet();
      if (st.onSelect) st.onSelect(iso);
    };
    list.querySelectorAll(".cal-day").forEach(function(btn){
      btn.onclick = function(){
        var iso = btn.getAttribute("data-iso");
        closeSheet();
        if (st.onSelect) st.onSelect(iso);
      };
    });
  }

  function nomeSecao(id){
    if (id === "ident") return "Identificação do Relatório";
    if (id === "atividades") return "Atividades do Dia";
    return "";
  }
  function temaAtual(){ return document.documentElement.getAttribute("data-theme") || "dark"; }
  function alternarTema(){
    var novo = temaAtual() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", novo);
    localStorage.setItem("gtm_theme", novo);
    render();
  }

  /* ======================= RENDER PRINCIPAL ======================= */
  function assinaturaTela(){
    return [App.tela, App.secaoAtiva, App.editAtividadeIdx, App.atualId].join("|");
  }
  var _ultimaAssinaturaTela = null;

  function render(){
    var app = document.getElementById("app");
    var mainAntigo = document.getElementById("main");
    var assinaturaAtual = assinaturaTela();
    var manterScroll = !!mainAntigo && assinaturaAtual === _ultimaAssinaturaTela;
    var scrollTop = manterScroll ? mainAntigo.scrollTop : 0;

    var footerHtml = "";
    var mainHtml = "";

    if (App.tela === "lista"){
      mainHtml = renderTelaLista();
      footerHtml = '<div class="app-footer"><button class="btn btn-primary" id="btn-novo">'+plusIcon()+' Novo Relatório</button></div>';
    } else if (App.tela === "secoes"){
      mainHtml = renderTelaSecoes();
      footerHtml = renderFooterSecoes();
    } else if (App.tela === "secao"){
      mainHtml = renderTelaSecao();
      footerHtml = renderFooterSecao();
    } else if (App.tela === "atividade"){
      mainHtml = renderTelaAtividade();
      footerHtml = renderFooterAtividade();
    } else if (App.tela === "sucesso"){
      mainHtml = renderTelaSucesso();
    }

    app.innerHTML = renderHeader() +
      '<main class="app-main" id="main">'+mainHtml+'</main>' +
      footerHtml;

    var mainNovo = document.getElementById("main");
    if (mainNovo) mainNovo.scrollTop = scrollTop;
    _ultimaAssinaturaTela = assinaturaAtual;

    ligarEventosGlobais();
    if (App.tela === "lista") ligarEventosLista();
    if (App.tela === "secoes") ligarEventosSecoes();
    if (App.tela === "secao") ligarEventosSecao();
    if (App.tela === "atividade") ligarEventosAtividade();
    if (App.tela === "sucesso") ligarEventosSucesso();

  function ligarEventosGlobais(){
    var btnTema = document.getElementById("btn-tema");
    if (btnTema) btnTema.onclick = alternarTema;
    var btnVoltar = document.getElementById("btn-voltar");
    if (btnVoltar) btnVoltar.onclick = voltar;
  }

  function voltar(){
    if (App.tela === "atividade"){
      var atual = atividadeEmEdicao();
      var mudou = atual && snapshotAtividade(atual) !== App._atividadeSnapshot;
      if (mudou){
        showConfirm(
          "Sair sem salvar?",
          "Você preencheu dados nesta atividade que ainda não foram salvos. Se sair agora, eles serão perdidos.",
          "Sair sem salvar",
          function(){ sairDaAtividade(); }
        );
        return;
      }
      sairDaAtividade();
      return;
    } else if (App.tela === "secao"){
      App.tela = "secoes";
      App.secaoAtiva = null;
    } else if (App.tela === "secoes"){
      App.tela = "lista";
      App.atualId = null;
    }
    render();
  }
  function sairDaAtividade(){
    App.tela = "secao";
    App.secaoAtiva = "atividades";
    App.editAtividadeIdx = null;
    App._atividadeSnapshot = null;
    render();
  }
  // Tira uma "foto" dos dados da atividade ao entrar na tela de edição, pra
  // comparar depois e avisar se o usuário tentar sair sem ter clicado em
  // Salvar. Fotos (Blob) viram só a contagem, pra não quebrar o JSON.stringify
  // e pra remover/adicionar foto também contar como alteração.
  function snapshotAtividade(a){
    return JSON.stringify(a, function(k, v){
      if (k === "fotos") return (v || []).length;
      return v;
    });
  }

  /* ======================= TELA: LISTA ======================= */
  function formatarData(iso){
    if (!iso) return "Sem data";
    var p = iso.split("-");
    if (p.length !== 3) return iso;
    return p[2]+"/"+p[1]+"/"+p[0];
  }
  function formatarDataHora(iso){
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    function pad(n){ return n < 10 ? "0"+n : ""+n; }
    return pad(d.getDate())+"/"+pad(d.getMonth()+1)+" "+pad(d.getHours())+":"+pad(d.getMinutes());
  }

  function capturarGPS(r){
    if (!("geolocation" in navigator)){ showToast("GPS não disponível neste aparelho."); return; }
    showToast("Obtendo localização...");
    navigator.geolocation.getCurrentPosition(function(pos){
      r.gps = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        precisao: pos.coords.accuracy || 0,
        capturadoEm: new Date().toISOString()
      };
      persistir(r);
      render();
      showToast("Localização capturada.");
    }, function(){
      showToast("Não foi possível obter a localização. Verifique a permissão de GPS.");
    }, { enableHighAccuracy:true, timeout:15000, maximumAge:60000 });
  }
  function renderTelaLista(){
    if (!App.relatorios.length){
      return '<div class="empty-state">'+boxIcon()+
        '<h3>Nenhum relatório ainda</h3>'+
        '<p>Toque em "Novo Relatório" para começar a preencher o RDO da frente de trabalho.</p></div>';
    }
    var ordenados = App.relatorios.slice().sort(function(a,b){ return (b.criadoEm||"").localeCompare(a.criadoEm||""); });
    var pendentes = ordenados.filter(relatorioPendente).length;
    var html = '<div class="container">';
    if (pendentes){
      html += '<div class="sync-agora-row">'+
        '<span>'+pendentes+' relatório(s) aguardando sincronização.</span>'+
        '<button class="btn-sync-agora" id="btn-sync-agora">Tentar agora</button>'+
      '</div>';
    }
    html += ordenados.map(function(r){
      var faz = r.fazenda || "Fazenda não informada";
      var badge;
      if (r.status !== "concluido"){
        badge = '<span class="badge rascunho">Rascunho em aberto</span>';
      } else if (!relatorioPendente(r)){
        badge = '<span class="badge concluido">Sincronizado</span>';
      } else {
        badge = '<span class="badge pendente-sync">Aguardando sincronização</span>';
      }
      var prog = progressoGeral(r);
      var sub = r.cliente ? r.cliente : "Cliente não informado";
      if (r.data) sub += " · " + formatarData(r.data);
      return '<div class="rdo-card" data-id="'+r.id+'">'+
        '<div class="rdo-card-top"><p class="fazenda">'+esc(faz)+'</p>'+
          '<button class="del" data-id="'+r.id+'">'+closeXIcon()+'</button></div>'+
        '<p class="sub">'+esc(sub)+'</p>'+
        '<div class="progress-row"><div class="progress-track"><div class="progress-fill" style="width:'+prog.pct+'%"></div></div>'+
        '<span class="progress-num">'+prog.pct+'%</span></div>'+
        badge+
      '</div>';
    }).join("");
    html += '</div>';
    return html;
  }
  function ligarEventosLista(){
    var btnSyncAgora = document.getElementById("btn-sync-agora");
    if (btnSyncAgora) btnSyncAgora.onclick = function(){
      if (!supabaseClient){
        showToast("Não foi possível conectar ao servidor (recarregue o app).");

      }

        showToast("Sem conexão com a internet.");
        return;
      }
      showToast("Sincronizando...");
      tentarSincronizarTodosPendentes().then(function(resultados){

  /* ======================= TELA: SEÇÕES (lista vertical) ======================= */
  function contarIdentRequerido(r){
    var ok = 0, total = 0;
    IDENT_CAMPOS.forEach(function(c){ if (!c.req) return; total++; if (r[c.k]) ok++; });
    return { ok: ok, total: total };
  }
  function contarIdentTodos(r){
    var ok = 0;
    IDENT_CAMPOS.forEach(function(c){ if (r[c.k]) ok++; });
    return { ok: ok, total: IDENT_CAMPOS.length };
  }
  function contarAtividades(r){
    return { ok: r.atividades.length > 0 ? 1 : 0, total: 1 };
  }
  function identCompleta(r){ var c = contarIdentRequerido(r); return c.total > 0 && c.ok === c.total; }
  function atividadesCompleta(r){ return r.atividades.length > 0; }

  function progressoGeral(r){
    var i = contarIdentTodos(r), a = contarAtividades(r);
    var ok = i.ok + a.ok, total = i.total + a.total;
    return { ok: ok, total: total, pct: total ? Math.round(ok/total*100) : 0 };
  }

    '</div></div>';
    html += '<div class="secoes-list">';

  function campoHtml(campo, valor){
    var reqStar = campo.req ? ' <span class="req">*</span>' : '';
    var label = '<label>'+esc(campo.l)+reqStar+'</label>';
    if (campo.t === "text"){
      return '<div class="field" data-k="'+campo.k+'">'+label+
        '<input type="text" data-k="'+campo.k+'" value="'+escAttr(valor||"")+'" placeholder="'+escAttr(campo.ph||"")+'"></div>';
    }
    if (campo.t === "number"){
      return '<div class="field" data-k="'+campo.k+'">'+label+
        '<input type="number" inputmode="decimal" step="'+(campo.step||"any")+'" data-k="'+campo.k+'" value="'+escAttr(valor==null?"":valor)+'"></div>';
    }
    if (campo.t === "date"){
      var dispVal = valor ? formatarData(valor) : "";
      var clsData = dispVal ? "val" : "placeholder";
      return '<div class="field" data-k="'+campo.k+'">'+label+
        '<div class="fake-select" data-k="'+campo.k+'" data-tipo="date">'+
          '<span class="'+clsData+'">'+esc(dispVal||"Selecionar data")+'</span>'+chevronIcon()+
        '</div></div>';
    }
    if (campo.t === "textarea"){
      return '<div class="field" data-k="'+campo.k+'">'+label+
        '<textarea data-k="'+campo.k+'" placeholder="Observações...">'+esc(valor||"")+'</textarea></div>';
    }
    if (campo.t === "select" || campo.t === "select-eq" || campo.t === "select-op" || campo.t === "select-tipo-hm"){
      var cls = valor ? "val" : "placeholder";
      return '<div class="field" data-k="'+campo.k+'">'+label+
        '<div class="fake-select" data-k="'+campo.k+'" data-tipo="'+campo.t+'">'+
          '<span class="'+cls+'">'+esc(valor||"Selecionar")+'</span>'+chevronIcon()+
        '</div></div>';
    }
    return "";
  }

  function renderTabIdentificacao(r){

        '<div class="actions">'+
          '<button class="btn btn-secondary btn-sm" id="btn-gps-recapturar">Recapturar</button>'+
          '<a class="btn btn-secondary btn-sm" href="'+escAttr(mapsUrl)+'" target="_blank" rel="noopener">Ver no mapa</a>'+
        '</div></div>';
    }
    return '<button class="add-dashed" id="btn-gps-capturar">'+pinIcon()+' Capturar localização da frente</button>';

  function resumoAtividade(a){
    var fotoTxt = (a.fotos && a.fotos.length) ? a.fotos.length+" foto"+(a.fotos.length>1?"s":"") : null;
    if (a.tipo_atividade === "Hora Máquina Trabalhada"){
      var partes = [];
      if (a.tipo) partes.push(a.tipo);
      var qtdMaq = (a.maquinas||[]).length;
      if (qtdMaq) partes.push(qtdMaq+" máquina"+(qtdMaq>1?"s":""));
      if (fotoTxt) partes.push(fotoTxt);
      return partes.join(" · ") || "Toque para preencher";
    }
    var partes2 = [];
    if (a.trecho) partes2.push("Trecho "+a.trecho);
    if (a.comprimento_m) partes2.push(a.comprimento_m+"m compr.");
    if (a.equipamentos && a.equipamentos.length) partes2.push(a.equipamentos.length+" equip.");
    if (fotoTxt) partes2.push(fotoTxt);
    return partes2.join(" · ") || "Toque para preencher";
  }
  function renderTabAtividades(r){

  function operadoresDisponiveis(r){ return CATALOGO.operadores; }

  // Pede confirmação e só reabre (volta a rascunho, sai do estado
  // sincronizado) se o usuário confirmar. aoConfirmar roda depois de reabrir
  // de verdade -- usado tanto pelo botão "Reabrir" quanto para bloquear a
  // entrada direto numa seção de um relatório já concluído.
  function confirmarReabrir(r, aoConfirmar){
    showConfirm(
      "Reabrir relatório?",
      "Ele volta a ser um rascunho editável e sai do estado sincronizado até ser concluído de novo.",
      "Reabrir",
      function(){
        r.status = "rascunho"; r.syncStatus = null; r.rpcSincronizado = false;
        persistir(r);
        showToast("Relatório reaberto para edição.");
        if (aoConfirmar) aoConfirmar();
      }
    );
  }

  function tentarConcluir(r){
    if (r.status === "concluido"){
      confirmarReabrir(r, render);
      return;
    }
    var faltando = [];
    IDENT_CAMPOS.forEach(function(c){ if (c.req && !r[c.k]) faltando.push(c.l); });
    if (!r.atividades.length) faltando.push("Ao menos 1 atividade");

    if (faltando.length){
      showInfo(
        "Relatório incompleto",
        "Preencha antes de concluir: " + faltando.join(", ") + "."
      );
      return;
    }

    if (!r.gps){
      showConfirm(
        "Localização não capturada",
        "Você não registrou o GPS da frente na Identificação. Deseja concluir o relatório mesmo assim?",
        "Concluir mesmo assim",
        function(){ concluirRelatorio(r); }
      );
      return;
    }

    concluirRelatorio(r);
  }
  function concluirRelatorio(r){
    r.status = "concluido";
    r.concluidoEm = new Date().toISOString();
    r.syncStatus = "pendente";
    persistir(r);
    App.tela = "sucesso";
    App.sucessoEstado = (supabaseClient && navigator.onLine) ? "enviando" : "pendente";
    render();

    if (supabaseClient && navigator.onLine){
      tentarSincronizar(r, function(){
        // só atualiza a mensagem da tela de sucesso se o usuário ainda
        // estiver olhando o resultado deste mesmo relatório
        if (App.tela === "sucesso" && App.atualId === r.id){
          App.sucessoEstado = relatorioSincronizado(r) ? "sincronizado" : "pendente";
          render();
        }
      });
    }
  }

  /* ======================= SINCRONIZAÇÃO COM O SUPABASE ======================= */
  // Nunca finge sucesso: se a sincronização falhar (sem internet, erro do
  // servidor), o relatório fica marcado "pendente" e o app tenta de novo
  // sozinho quando a conexão voltar -- mesmo comportamento do painel de
  // biomassa. O envio das fotos acontece antes do RPC, pra já mandar o
  // storage_path de cada uma junto com o relatório.

  function caminhoFoto(r, atividadeId, foto){
    return r.id + "/" + atividadeId + "/" + foto.id + ".jpg";
  }

  function uploadFotosPendentes(r){
    if (!supabaseClient) return Promise.resolve();
    var envios = [];
    r.atividades.forEach(function(a){
      (a.fotos || []).forEach(function(f){
        if (f.storagePath || !f.blob) return; // já enviada, ou sem blob (reaberta sem o binário)
        var caminho = caminhoFoto(r, a.id, f);
        envios.push(
          supabaseClient.storage.from(BUCKET_EVIDENCIAS)
            .upload(caminho, f.blob, { upsert: true, contentType: "image/jpeg" })
            .then(function(resp){
              if (resp.error){
                console.warn("Falha ao enviar foto para o Storage:", resp.error.message || resp.error);
              } else {
                f.storagePath = caminho;
              }
            })
            .catch(function(err){
              console.warn("Falha ao enviar foto para o Storage:", err);
            })
        );
      });
    });
    return Promise.all(envios);
  }

  // rpcSincronizado é um flag monotônico (só vira true, nunca volta sozinho)
  // que registra se o RPC do texto já teve sucesso alguma vez para os dados
  // atuais. "Sincronizado de verdade" exige ISSO **e** toda foto com
  // storagePath -- checando os dois de forma independente, sem se basear
  // no próprio resultado anterior (syncStatus), que criava uma referência
  // circular: uma vez "pendente", nunca mais recalculava certo sozinho.
  function todasFotosEnviadas(r){
    return r.atividades.every(function(a){
      return (a.fotos || []).every(function(f){ return !f.blob || f.storagePath; });
    });
  }
  function relatorioSincronizado(r){
    return r.status === "concluido" && r.rpcSincronizado === true && todasFotosEnviadas(r);
  }
  function relatorioPendente(r){
    return r.status === "concluido" && !relatorioSincronizado(r);
  }

  function construirPayloadRelatorio(r){
    return {
      uuid_dispositivo: r.id,
      empresa: r.empresa,
      cliente: r.cliente, contrato: r.contrato, faena: r.faena,
      tipo_estrada: r.tipo_estrada, equipe_frente: r.equipe_frente, fazenda: r.fazenda,
      data: r.data, encarregado: r.encarregado, supervisor: r.supervisor,
      tecnico_arauco: r.tecnico_arauco, supervisor_arauco: r.supervisor_arauco,
      gps: r.gps ? { lat: r.gps.lat, lng: r.gps.lng, precisao: r.gps.precisao, capturadoEm: r.gps.capturadoEm } : null,
      criadoEm: r.criadoEm, concluidoEm: r.concluidoEm,
      atividades: r.atividades.map(function(a){
        return {
          tipo_atividade: a.tipo_atividade,
          comprimento_m: a.comprimento_m, largura_m: a.largura_m, profundidade_cm: a.profundidade_cm,
          dmt_km_inicial: a.dmt_km_inicial, dmt_km_final: a.dmt_km_final,
          trecho: a.trecho, tipo: a.tipo, observacao: a.observacao,
          equipamentos: (a.equipamentos || []).map(function(e){ return { equipamento: e.equipamento, operador: e.operador }; }),
          maquinas: (a.maquinas || []).map(function(m){ return { equipamento: m.equipamento, operador: m.operador, hora_inicial: m.hora_inicial, hora_final: m.hora_final }; }),
          fotos: (a.fotos || []).filter(function(f){ return f.storagePath; }).map(function(f){ return { storage_path: f.storagePath }; })
        };
      })
    };
  }

  function sincronizarRelatorio(r){
    if (!supabaseClient) return Promise.resolve(false);
    return uploadFotosPendentes(r).then(function(){
      persistir(r); // grava os storagePath que as fotos ganharam, mesmo se o RPC falhar depois
      var payload = construirPayloadRelatorio(r);
      return supabaseClient.rpc("sincronizar_relatorio_rdo", { p_payload: payload });
    }).then(function(resp){
      if (!resp || resp.error){
        console.warn("Falha ao sincronizar relatório:", resp && resp.error && resp.error.message);
        return false;
      }
      return true;
    }).catch(function(err){
      console.warn("Falha ao sincronizar relatório:", err);
      return false;
    });
  }

  var _sincronizando = {}; // evita reenviar o mesmo relatório 2x em paralelo
  function tentarSincronizar(r, onDone){
    if (!supabaseClient){
      console.warn("Sincronização não tentada: cliente Supabase não inicializado (o script @supabase/supabase-js não carregou).");
      if (onDone) onDone();
      return Promise.resolve(false);
    }
    if (!navigator.onLine){
      if (onDone) onDone();
      return Promise.resolve(false);
    }
    if (!relatorioPendente(r)){
      if (onDone) onDone();
      return Promise.resolve(true);
    }
    if (_sincronizando[r.id]) return Promise.resolve(false); // já tem uma tentativa rodando pra esse relatório
    _sincronizando[r.id] = true;
    return sincronizarRelatorio(r).then(function(ok){
      delete _sincronizando[r.id];
      if (ok){
        r.rpcSincronizado = true;
        r.syncStatus = relatorioSincronizado(r) ? "sincronizado" : "pendente";
        r.sincronizadoEm = new Date().toISOString();
        persistir(r);
        render();
      }
      if (onDone) onDone();
      return ok;
    });
  }
  function tentarSincronizarTodosPendentes(){
    return Promise.all(App.relatorios.filter(relatorioPendente).map(function(r){ return tentarSincronizar(r); }));
  }

  /* ======================= TELA: ATIVIDADE ======================= */
  function atividadeEmEdicao(){
    if (App.editAtividadeIdx === "novo") return App._novaAtividade;
    var r = relatorioAtual();
    return r.atividades[App.editAtividadeIdx];
  }
  function renderTelaAtividade(){
    var a = atividadeEmEdicao();
    if (!a) return "";
    var html = '<div class="container">';
    html += '<div class="field"><label>Tipo de atividade <span class="req">*</span></label>'+
      '<div class="fake-select" id="sel-tipo-ativ"><span class="'+(a.tipo_atividade?"val":"placeholder")+'">'+
      esc(a.tipo_atividade||"Selecionar tipo")+'</span>'+chevronIcon()+'</div></div>';

    if (a.tipo_atividade === "Hora Máquina Trabalhada"){
      var camposHM = camposAtividade(a.tipo_atividade); // [tipo, observacao]
      html += campoHtml(camposHM[0], a.tipo);

      html += '<div class="section-title">Máquinas utilizadas</div>';
      html += '<p class="helper-text" style="margin-top:0">Cada máquina tem sua própria hora inicial e final.</p>';
      (a.maquinas||[]).forEach(function(m, idx){
        html += '<div class="maquina-card">'+
          '<div class="row-2">'+
            '<div class="fake-select" data-maqidx="'+idx+'" data-campo="equipamento"><span class="'+(m.equipamento?"val":"placeholder")+'">'+esc(m.equipamento||"Equipamento")+'</span>'+chevronIcon()+'</div>'+
            '<div class="fake-select" data-maqidx="'+idx+'" data-campo="operador"><span class="'+(m.operador?"val":"placeholder")+'">'+esc(m.operador||"Operador")+'</span>'+chevronIcon()+'</div>'+
          '</div>'+
          '<div class="row-2">'+
            '<input type="number" inputmode="decimal" step="0.1" placeholder="Hora inicial" data-maqidx="'+idx+'" data-campo="hora_inicial" value="'+escAttr(m.hora_inicial==null?"":m.hora_inicial)+'">'+
            '<input type="number" inputmode="decimal" step="0.1" placeholder="Hora final" data-maqidx="'+idx+'" data-campo="hora_final" value="'+escAttr(m.hora_final==null?"":m.hora_final)+'">'+
          '</div>'+
          '<button class="rm-maquina" data-maqidx="'+idx+'" data-action="rm-maquina">'+closeXIcon()+' Remover máquina</button>'+
        '</div>';
      });
      html += '<button class="add-dashed" id="btn-add-maquina">'+plusIcon()+' Adicionar máquina</button>';

      html += campoHtml(camposHM[1], a.observacao);

      html += '<div class="section-title">Evidências fotográficas</div>';
      html += renderFotoGridHtml(a);
    } else if (a.tipo_atividade){
      var campos = camposAtividade(a.tipo_atividade);
      campos.forEach(function(c){ html += campoHtml(c, a[c.k]); });

      html += '<div class="section-title">Equipamentos utilizados</div>';
      (a.equipamentos||[]).forEach(function(eq, idx){
        html += '<div class="eq-pair">'+
          '<div class="fake-select" data-eqidx="'+idx+'" data-campo="equipamento"><span class="'+(eq.equipamento?"val":"placeholder")+'">'+esc(eq.equipamento||"Equipamento")+'</span>'+chevronIcon()+'</div>'+
          '<div class="fake-select" data-eqidx="'+idx+'" data-campo="operador"><span class="'+(eq.operador?"val":"placeholder")+'">'+esc(eq.operador||"Operador")+'</span>'+chevronIcon()+'</div>'+
          '<button class="rm" data-eqidx="'+idx+'" data-action="rm-eq">'+closeXIcon()+'</button>'+
        '</div>';
      });
      html += '<button class="add-dashed" id="btn-add-eq">'+plusIcon()+' Adicionar equipamento</button>';

      html += '<div class="section-title">Evidências fotográficas</div>';
      html += renderFotoGridHtml(a);
    }
    html += '</div>';
    return html;
  }
  function renderFotoGridHtml(a){
    var html = '<div class="foto-grid">';
    (a.fotos||[]).forEach(function(f, idx){
      html += '<div class="foto-thumb"><img src="'+f.url+'" alt="Evidência '+(idx+1)+'">'+
        '<button class="rm-foto" data-fidx="'+idx+'" data-action="rm-foto">'+closeXIcon()+'</button></div>';
    });
    html += '</div>';
    html += '<div class="foto-actions-row">';
    html += '<button class="add-dashed" id="btn-foto-camera">'+cameraIcon()+' Tirar foto</button>';
    html += '<button class="add-dashed" id="btn-foto-galeria">'+imageIcon()+' Galeria</button>';
    html += '</div>';
    html += '<input type="file" id="input-foto-camera" accept="image/*" capture="environment" class="hidden">';
    html += '<input type="file" id="input-foto-galeria" accept="image/*" multiple class="hidden">';
    return html;
  }
  function renderFooterAtividade(){
    return '<div class="app-footer"><button class="btn btn-primary" id="btn-salvar-ativ">Salvar atividade</button></div>';
  }
  function ligarEventosAtividade(){
    var a = atividadeEmEdicao();
    var r = relatorioAtual();

    var selTipo = document.getElementById("sel-tipo-ativ");
    if (selTipo) selTipo.onclick = function(){
      openSheet("Tipo de atividade", CATALOGO.tiposAtividade, a.tipo_atividade, function(v){
        var novo = { id: a.id || uid(), tipo_atividade: v, equipamentos: [], maquinas: [], fotos: (a.fotos || []) };
        if (App.editAtividadeIdx === "novo") App._novaAtividade = novo;
        else r.atividades[App.editAtividadeIdx] = novo;
        render();
      }, false);
    };

    document.querySelectorAll("#main input[data-k]").forEach(function(input){
      input.addEventListener("change", function(){
        var k = input.getAttribute("data-k");
        a[k] = input.type === "number" ? (input.value === "" ? null : Number(input.value)) : input.value;
      });
    });
    document.querySelectorAll("#main textarea[data-k]").forEach(function(ta){
      ta.addEventListener("change", function(){ a[ta.getAttribute("data-k")] = ta.value; });
    });
    // campos "select" genéricos definidos em camposAtividade (ex: trecho, tipo)
    document.querySelectorAll('#main .fake-select[data-tipo]').forEach(function(sel){
      var k = sel.getAttribute("data-k");
      if (k === "tipo"){
        sel.onclick = function(){
          openSheet("Tipo", CATALOGO.tiposHoraMaquina, a.tipo, function(v){ a.tipo = v; render(); }, false);
        };
        return;
      }
      var campo = camposAtividade(a.tipo_atividade).filter(function(c){ return c.k === k; })[0];
      if (!campo || !campo.opts) return;
      sel.onclick = function(){
        openSheet(campo.l, campo.opts, a[k], function(v){ a[k] = v; render(); }, true);
      };
    });

    var btnAddEq = document.getElementById("btn-add-eq");
    if (btnAddEq) btnAddEq.onclick = function(){
      a.equipamentos = a.equipamentos || [];
      a.equipamentos.push({ equipamento:"", operador:"" });
      render();
    };
    document.querySelectorAll('.eq-pair .fake-select[data-campo="equipamento"]').forEach(function(sel){
      sel.onclick = function(){
        var idx = Number(sel.getAttribute("data-eqidx"));
        openSheet("Equipamento", equipamentosDisponiveis(r), a.equipamentos[idx].equipamento, function(v){
          a.equipamentos[idx].equipamento = v; render();
        }, true);
      };
    });
    document.querySelectorAll('.eq-pair .fake-select[data-campo="operador"]').forEach(function(sel){
      sel.onclick = function(){
        var idx = Number(sel.getAttribute("data-eqidx"));
        openSheet("Operador", operadoresDisponiveis(r), a.equipamentos[idx].operador, function(v){
          a.equipamentos[idx].operador = v; render();
        }, true);
      };
    });
    document.querySelectorAll('[data-action="rm-eq"]').forEach(function(btn){
      btn.onclick = function(){
        var idx = Number(btn.getAttribute("data-eqidx"));
        a.equipamentos.splice(idx,1); render();
      };
    });

    // máquinas utilizadas (Hora Máquina Trabalhada) — cada máquina tem
    // equipamento, operador, hora inicial e hora final próprios
    var btnAddMaquina = document.getElementById("btn-add-maquina");
    if (btnAddMaquina) btnAddMaquina.onclick = function(){
      a.maquinas = a.maquinas || [];
      a.maquinas.push({ equipamento:"", operador:"", hora_inicial:null, hora_final:null });
      render();
    };
    document.querySelectorAll('.maquina-card .fake-select[data-campo="equipamento"]').forEach(function(sel){
      sel.onclick = function(){
        var idx = Number(sel.getAttribute("data-maqidx"));
        openSheet("Equipamento", equipamentosDisponiveis(r), a.maquinas[idx].equipamento, function(v){
          a.maquinas[idx].equipamento = v; render();
        }, true);
      };
    });
    document.querySelectorAll('.maquina-card .fake-select[data-campo="operador"]').forEach(function(sel){
      sel.onclick = function(){
        var idx = Number(sel.getAttribute("data-maqidx"));
        openSheet("Operador", operadoresDisponiveis(r), a.maquinas[idx].operador, function(v){
          a.maquinas[idx].operador = v; render();
        }, true);
      };
    });
    document.querySelectorAll('.maquina-card input[data-campo]').forEach(function(input){
      input.addEventListener("change", function(){
        var idx = Number(input.getAttribute("data-maqidx"));
        var campo = input.getAttribute("data-campo");
        a.maquinas[idx][campo] = input.value === "" ? null : Number(input.value);
      });
    });
    document.querySelectorAll('[data-action="rm-maquina"]').forEach(function(btn){
      btn.onclick = function(){
        var idx = Number(btn.getAttribute("data-maqidx"));
        a.maquinas.splice(idx,1); render();
      };
    });

    function processarArquivosFoto(fileList){
      var arquivos = Array.prototype.slice.call(fileList);
      if (!arquivos.length) return;
      a.fotos = a.fotos || [];
      var toastMsg = arquivos.length > 1 ? "Processando " + arquivos.length + " fotos..." : "Processando foto...";
      showToast(toastMsg);
      Promise.all(arquivos.map(function(file){
        return comprimirImagem(file, FOTO_MAX_DIM, FOTO_QUALIDADE);
      })).then(function(blobs){
        blobs.forEach(function(blob){
          var url = "";
          try { url = URL.createObjectURL(blob); } catch(e){}
          a.fotos.push({ id: uid(), blob: blob, url: url, storagePath: null });
        });
        render();
      });
    }

    var btnFotoCamera = document.getElementById("btn-foto-camera");
    var inputFotoCamera = document.getElementById("input-foto-camera");
    if (btnFotoCamera && inputFotoCamera) btnFotoCamera.onclick = function(){ inputFotoCamera.click(); };
    if (inputFotoCamera) inputFotoCamera.onchange = function(){
      processarArquivosFoto(inputFotoCamera.files);
      inputFotoCamera.value = "";
    };

    var btnFotoGaleria = document.getElementById("btn-foto-galeria");
    var inputFotoGaleria = document.getElementById("input-foto-galeria");
    if (btnFotoGaleria && inputFotoGaleria) btnFotoGaleria.onclick = function(){ inputFotoGaleria.click(); };
    if (inputFotoGaleria) inputFotoGaleria.onchange = function(){
      processarArquivosFoto(inputFotoGaleria.files);
      inputFotoGaleria.value = "";
    };

    document.querySelectorAll('[data-action="rm-foto"]').forEach(function(btn){
      btn.onclick = function(){
        var idx = Number(btn.getAttribute("data-fidx"));
        var foto = a.fotos[idx];
        if (foto && foto.url){ try { URL.revokeObjectURL(foto.url); } catch(e){} }
        a.fotos.splice(idx,1);
        render();
      };
    });

    var btnSalvar = document.getElementById("btn-salvar-ativ");
    if (btnSalvar) btnSalvar.onclick = function(){
      if (!a.tipo_atividade){ showToast("Selecione o tipo de atividade."); return; }
      var faltando = validarAtividade(a);
      if (faltando.length){
        showInfo("Campos obrigatórios pendentes", "Preencha antes de salvar: " + faltando.join(", ") + ".");
        return;
      }
      if (App.editAtividadeIdx === "novo") r.atividades.push(a);
      else r.atividades[App.editAtividadeIdx] = a;
      persistir(r);
      App.tela = "secao";
      App.secaoAtiva = "atividades";
      App.editAtividadeIdx = null;
      App._atividadeSnapshot = null;
      render();
    };
  }

  function validarAtividade(a){
    var faltando = [];
    camposAtividade(a.tipo_atividade).forEach(function(c){
      if (!c.req) return;
      var v = a[c.k];
      if (v === undefined || v === null || v === "") faltando.push(c.l);
    });
    if (a.tipo_atividade === "Hora Máquina Trabalhada"){
      if (!a.maquinas || !a.maquinas.length){
        faltando.push("Ao menos 1 máquina utilizada");
      } else if (a.maquinas.some(function(m){
        return !m.equipamento || !m.operador || m.hora_inicial === null || m.hora_inicial === undefined || m.hora_final === null || m.hora_final === undefined;
      })){
        faltando.push("Equipamento, operador e horas de todas as máquinas da lista");
      }
    } else {
      if (!a.equipamentos || !a.equipamentos.length){
        faltando.push("Ao menos 1 equipamento utilizado");
      } else if (a.equipamentos.some(function(eq){ return !eq.equipamento || !eq.operador; })){
        faltando.push("Equipamento e operador de todos os itens da lista de equipamentos");
      }
    }
    return faltando;
  }

  /* ======================= TELA: SUCESSO ======================= */
  function renderTelaSucesso(){
    var estado = App.sucessoEstado || "pendente";
    if (estado === "enviando"){
      return '<div class="sucesso-wrap">'+
        '<div class="sucesso-check estado-enviando">'+spinnerIcon()+'</div>'+
        '<h2>Enviando relatório...</h2>'+
        '<p>Subindo fotos e sincronizando com o servidor. Pode continuar usando o app normalmente.</p>'+
        '<button class="btn btn-primary" id="btn-voltar-lista" style="max-width:220px">Voltar para a lista</button>'+
      '</div>';
    }
    if (estado === "sincronizado"){
      return '<div class="sucesso-wrap">'+
        '<div class="sucesso-check">'+checkIcon()+'</div>'+
        '<h2>Relatório enviado</h2>'+
        '<p>Sincronizado com sucesso no servidor.</p>'+
        '<button class="btn btn-primary" id="btn-voltar-lista" style="max-width:220px">Voltar para a lista</button>'+
      '</div>';
    }
    return '<div class="sucesso-wrap">'+
      '<div class="sucesso-check estado-pendente">'+clockIcon()+'</div>'+
      '<h2>Relatório salvo</h2>'+
      '<p>Ainda não foi possível sincronizar com o servidor. Fica salvo neste aparelho e é enviado automaticamente assim que houver conexão.</p>'+
      '<button class="btn btn-primary" id="btn-voltar-lista" style="max-width:220px">Voltar para a lista</button>'+
    '</div>';
  }
  function ligarEventosSucesso(){
    document.getElementById("btn-voltar-lista").onclick = function(){
      App.atualId = null; App.sucessoEstado = null; App.tela = "lista"; render();
    };
  }

  /* ======================= ONLINE / OFFLINE ======================= */
  window.addEventListener("online", function(){
    render();
    tentarSincronizarTodosPendentes();
  });
  window.addEventListener("offline", render);

  /* ======================= INIT ======================= */
  var temaSalvo = localStorage.getItem("gtm_theme");
  document.documentElement.setAttribute("data-theme", temaSalvo || "dark");

  function regenerarUrlsFotos(lista){
    lista.forEach(function(r){
      (r.atividades||[]).forEach(function(a){
        (a.fotos||[]).forEach(function(f){
          if (f && f.blob){ try { f.url = URL.createObjectURL(f.blob); } catch(e){} }
        });
      });
    });
  }

  dbGetAll().then(function(lista){
    regenerarUrlsFotos(lista);
    App.relatorios = lista;
    render();
    if (navigator.onLine) tentarSincronizarTodosPendentes();
  });
  carregarCadastrosCache();
  atualizarCadastrosRemoto();

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){ /* silencioso */ });
    });
  }
})();
